# Subject Likeness — Z-Image Turbo + Weight Noise
#
# LoKr + weight noise on Z-Image Turbo. Trains through the de-distill
# assistant LoRA so the optimizer sees a "base-like" model; the trained LoRA
# inverts cleanly back to 8-step turbo at sample time. The transformer is NOT
# quantized — Tongyi-MAI explicitly warns FP8 on Turbo causes noticeable
# quality degradation. The text encoder is quantized to qfloat8.
#
# Custom timestep distribution + curve front-load training on the steps
# Turbo's distillation needs the most correction at (high-t early denoising
# via the distribution, low-mid-t via the curve).
#
# YAML mirror of the "Subject Likeness (Z-Image Turbo + Weight Noise)"
# quickstart template in ui/src/app/jobs/new/quickstarts.ts. The two stay in
# sync; this file is the CLI surface (`python run.py <this>`) and the
# quickstart dropdown is the UI surface.
#
# Fill in:
#   - config.name                                    (your training name)
#   - config.process[0].datasets[0].folder_path      (path to your images)
---
job: extension
config:
  name: ""                                             # FILL IN: training name (folder + filename)
  process:
    - type: "diffusion_trainer"
      # Relative path resolves to <CWD>/output. The UI defaults to the same
      # place. On Runpod, /app/ai-toolkit/output is symlinked to
      # /workspace/output for persistence (see docker/start.sh).
      training_folder: "output"
      sqlite_db_path: "./aitk_db.db"
      device: cuda
      trigger_word: null
      performance_log_every: 10
      network:
        type: "lokr"
        linear: 32
        linear_alpha: 32
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: 8
        network_kwargs:
          ignore_if_contains: []
      save:
        dtype: bf16
        save_every: 100
        max_step_saves_to_keep: 120
        save_format: diffusers
        push_to_hub: false
      datasets:
        # Single 1024 bucket — matches the validated production run.
        # Multi-bucket (1024/768/512) was tried and was empirically worse
        # for ZiT than holding the bucket at native resolution.
        - folder_path: ""                              # FILL IN: path to training images
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          is_reg: false
          network_weight: 1
          resolution: [1024]
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
          diffusion_loss_weight: 1
          depth_loss_weight: 0.005
          loss_split: sum
      train:
        # Gaussian noise on LoRA weights each optimizer step. sigma=0.0125 in
        # relative mode = 1.25% of per-tensor weight RMS. Matches the
        # Flux 2 Klein recipe — empirically the lower 0.01 was tried for
        # Turbo and rolled back to 0.0125.
        weight_noise:
          enabled: true
          mode: relative
          sigma: 0.0125
          log_every: 1
        max_grad_norm: 1
        batch_size: 4
        bypass_guidance_embedding: false
        # ZiT can take up to ~200 steps per training image to converge, so a
        # 10 to 15 image dataset wants something in the 2000 to 3000 range.
        # Optimizations to bring this down are in progress.
        steps: 3000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        timestep_type: linear
        content_or_style: balanced
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: true
        lr: 2.5e-4
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: false
        force_first_sample: true
        disable_sampling: false
        dtype: bf16
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: person
        switch_boundary_every: 1
        loss_type: mse
        diffusion_loss_weight: 1
        diffusion_loss_max_t: 1
        diffusion_loss_min_t: 0
        # Front-load training on the timesteps Turbo's distillation needs
        # most correction at — high-t (early denoising) for the distribution,
        # low-mid-t for the curve. Trainer evaluates these via PCHIP.
        custom_timestep_distribution:
          points:
            - { x: 0,                    y: 1 }
            - { x: 0.048801606351679024, y: 3 }
            - { x: 0.12443620508367365,  y: 1.1754955492521588 }
            - { x: 1,                    y: 1.124230987147281 }
          normalize: false
          sourceName: high_90s
        custom_timestep_curve:
          points:
            - { x: 0,                    y: 1 }
            - { x: 0.6226329803466797,   y: 2.0341763245432 }
            - { x: 0.6226329803466797,   y: 2.0341763245432 }
            - { x: 1,                    y: 1 }
          normalize: true
          sourceName: boost_low_mid_t
        max_denoising_steps: 999
        min_denoising_steps: 0
        loss_split: null
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Tongyi-MAI/Z-Image-Turbo"
        # Transformer in bf16 — Tongyi-MAI explicitly warns that FP8 on
        # Z-Image Turbo causes noticeable quality degradation. TE quantization
        # is fine.
        quantize: false
        qtype: qfloat8
        quantize_te: true
        qtype_te: qfloat8
        arch: zimage:turbo
        low_vram: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
        # De-distill adapter — merged at load with +1.0, runtime inverted to
        # -1.0 at sample time. See ZImageModel.load_training_adapter.
        assistant_lora_path: "ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v2.safetensors"
      sample:
        sampler: flowmatch
        sample_every: 100
        width: 1024
        height: 1024
        samples:
          - prompt: "a photo of a person"
        neg: ""
        seed: 42
        walk_seed: false
        # Turbo expects guidance_scale=1 and 8 steps. Higher CFG washes out.
        guidance_scale: 1
        sample_steps: 8
        num_frames: 1
        fps: 1
      face_id:
        enabled: false
        init_scale: 0.3
        identity_loss_weight: 0
        landmark_loss_weight: 0
        body_proportion_loss_weight: 0
        body_proportion_loss_min_t: 0.8
        body_proportion_loss_max_t: 1
        body_shape_loss_weight: 0
        body_shape_loss_max_t: 1
        body_shape_loss_min_t: 0.8
        identity_loss_min_t: 0
        identity_loss_max_t: 0.9
        identity_metrics: false
        identity_loss_use_average: true
        identity_loss_min_cos: 0.4
      depth_consistency:
        loss_weight: 0.005
        input_size: 518
        preview_every: 1
        # 'subject' restricts the depth-loss perceptor to the cached subject
        # mask (kept in sync with subject_mask.enabled below).
        mask_source: subject
        loss_max_t: 1
        model_id: "depth-anything/Depth-Anything-V2-Large-hf"
        loss_min_t: 0
        grad_checkpoint: true
        ssi_weight: 0
        grad_weight: 1
        grad_scales: 6
      subject_mask:
        enabled: true
        background_loss_weight: 0
        clothing_loss_weight: 1
        save_debug_previews: true
        cache_resolution: 768
        segformer_res: 768
meta:
  name: "[name]"
  version: "1.0"
